name: CI-CD

on:
  push:
    branches: [main]

jobs:
  build-scan-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Update GitOps repo with new image tag
        run: |
          git clone https://x-access-token:${{ secrets.GITOPS_PAT }}@github.com/${{ github.repository_owner }}/myapp-gitops.git
          cd myapp-gitops
          sed -i "s|ghcr.io/.*/myapp:.*|ghcr.io/${{ github.repository_owner }}/myapp:${{ github.sha }}|" deployment.yaml
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git commit -am "Update image to ${{ github.sha }}"
          git push
